<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 160" width="100%" height="100%">
  <defs>
    <style>
      .text-title { font-family: 'Montserrat', sans-serif; font-weight: 800; fill: #121212; font-size: 32px; letter-spacing: -0.5px; }
      .text-sub { font-family: 'Montserrat', sans-serif; font-weight: 700; fill: #D96B27; font-size: 15px; letter-spacing: 3px; }
      .text-loc { font-family: 'Montserrat', sans-serif; font-weight: 600; fill: #6E6E6E; font-size: 12px; letter-spacing: 1.5px; }
      .petal { fill: #D96B27; stroke: #121212; stroke-width: 2.2; stroke-linejoin: round; }
      .center-circle { fill: #121212; stroke: #D96B27; stroke-width: 3; }
      .inner-dot { fill: #FAF7F2; }
    </style>
  </defs>

  <!-- Isotipo: Flor de Virutas de Lápiz y Sol Literario Tabasqueño -->
  <g transform="translate(85, 80) scale(1.05)">
    <!-- 8 Pétalos en abanico giratorio de viruta de lápiz -->
    <path class="petal" d="M0,0 L-14,-56 C-7,-62 7,-62 14,-56 Z" transform="rotate(0)" />
    <path class="petal" d="M0,0 L-14,-56 C-7,-62 7,-62 14,-56 Z" transform="rotate(45)" />
    <path class="petal" d="M0,0 L-14,-56 C-7,-62 7,-62 14,-56 Z" transform="rotate(90)" />
    <path class="petal" d="M0,0 L-14,-56 C-7,-62 7,-62 14,-56 Z" transform="rotate(135)" />
    <path class="petal" d="M0,0 L-14,-56 C-7,-62 7,-62 14,-56 Z" transform="rotate(180)" />
    <path class="petal" d="M0,0 L-14,-56 C-7,-62 7,-62 14,-56 Z" transform="rotate(225)" />
    <path class="petal" d="M0,0 L-14,-56 C-7,-62 7,-62 14,-56 Z" transform="rotate(270)" />
    <path class="petal" d="M0,0 L-14,-56 C-7,-62 7,-62 14,-56 Z" transform="rotate(315)" />
    
    <!-- Centro Negro Carbón con detalle Cobre -->
    <circle class="center-circle" cx="0" cy="0" r="22" />
    <circle class="inner-dot" cx="0" cy="0" r="7" />
  </g>

  <!-- Tipografía Institucional LVT -->
  <text x="175" y="65" class="text-title">Letras y Voces</text>
  <text x="176" y="96" class="text-sub">DE TABASCO, A.C.</text>
  <text x="176" y="122" class="text-loc">SOCIEDAD DE ESCRITORES · VILLAHERMOSA</text>
</svg>
